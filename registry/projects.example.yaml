# UNO project registry. One entry per project. Humans own tier, wave, owner and autonomy.
# Autonomy: L1 suggest · L2 open PRs, human reviews every PR · L3 auto-merge low-risk (never for sensitive tier)

projects:
  - name: internal-wiki
    repo: your-org/internal-wiki
    owner: <name>
    tier: internal          # open | internal | sensitive
    wave: 1
    autonomy: L1
    plugins: [core]
    uno_release: v0.2.0
    onboarding: not-started # not-started | discovery | review | setup | done
    notes: ""

  - name: patient-journey
    repo: your-org/patient-journey
    owner: <name>
    tier: sensitive
    wave: 2
    autonomy: L1            # sensitive tier caps at L2
    plugins: [core]          # tier rules live in core
    uno_release: v0.2.0
    onboarding: not-started
    notes: "patient data in src/patients, HIS integration"
