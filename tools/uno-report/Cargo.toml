[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
# Same number as plugins/core/.claude-plugin/plugin.json (tests/version.rs checks it).
version = "0.5.21"
edition = "2021"
# notify-types 2.3 needs 1.91; clap 4.6 needs edition 2024 (1.85)
rust-version = "1.91"

[package]
name = "uno-report"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "UNO dashboard + manual in one local HTML file, built from ~/UNO/data"
publish = false

[dependencies]
domain = { path = "crates/domain" }
app = { path = "crates/app" }
adapters-fs = { path = "crates/adapters-fs" }
adapters-os = { path = "crates/adapters-os" }
adapters-web = { path = "crates/adapters-web" }
adapters-file = { path = "crates/adapters-file" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }

[profile.release]
strip = true
