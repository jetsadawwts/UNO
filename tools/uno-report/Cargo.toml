[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2021"

[package]
name = "uno-report"
version = "0.1.0"
edition.workspace = true
description = "UNO dashboard + manual in one local HTML file, built from ~/UNO/data"
publish = false

[dependencies]
domain = { path = "crates/domain" }
serde_json = "1"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }

[profile.release]
strip = true
