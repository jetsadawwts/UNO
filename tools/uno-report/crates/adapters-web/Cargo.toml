[package]
name = "adapters-web"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "uno-report adapter: HTML views, charts, assets and the local live server."

[dependencies]
domain = { path = "../domain" }
app = { path = "../app" }
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }


[dev-dependencies]
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
